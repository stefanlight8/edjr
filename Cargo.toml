[package]
name = "edjr"
version = "0.1.0"
rust-version = "1.85.1"
edition = "2024"
description = "Elite Dangerous Journal Reader"
authors = ["stefanlight8 <64615032+stefanlight8@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/stefanlight8/edjr"
keywords = ["Elite Dangerous", "Journal"]

[badges]
maintenance = { status = "actively-developed" }

[workspace]
resolver = "3"
members = ["examples/*"]

[workspace.dependencies]
edjr = { path = "." }

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tokio = { version = "1.52.3", features = ["fs", "io-util"], optional = true }
async-stream = { version = "0.3.6", optional = true }
futures-lite = { version = "2.6.1", optional = true }
serde_repr = "0.1.20"

[features]
tokio = ["dep:tokio"]
stream = ["dep:async-stream", "dep:futures-lite"]
