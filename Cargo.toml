[package]
name = "edjr"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["examples/*"]

[workspace.dependencies]
edjr = { path = "." }

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["fs"], optional = true }

[features]
tokio = ["dep:tokio"]
